name: Build, test and package

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OfficeSecurity.slnx

      - name: Build
        run: dotnet build OfficeSecurity.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OfficeSecurity.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish Windows executables
        shell: pwsh
        run: |
          $apps = @{
            'Server'         = 'src/Server/OfficeSecurity.Server.Api'
            'Agent'          = 'src/Agent/OfficeSecurity.Agent'
            'AdminDashboard' = 'src/Clients/OfficeSecurity.AdminDashboard'
            'StaffApp'       = 'src/Clients/OfficeSecurity.StaffApp'
          }
          foreach ($name in $apps.Keys) {
            dotnet publish $apps[$name] --configuration Release --runtime win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              --output "publish/OfficeSecurity-win-x64/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item docs/deployment/READ-ME-FIRST.txt publish/OfficeSecurity-win-x64/

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: OfficeSecurity-win-x64
          path: publish/OfficeSecurity-win-x64
          retention-days: 30
