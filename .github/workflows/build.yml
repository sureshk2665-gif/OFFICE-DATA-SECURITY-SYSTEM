name: Build, test and package

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OfficeSecurity.slnx

      - name: Build
        run: dotnet build OfficeSecurity.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OfficeSecurity.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Check the agent's Windows policy values against the Windows policy definitions (ADMX)
        run: >
          dotnet test tests/OfficeSecurity.Agent.UnitTests/OfficeSecurity.Agent.UnitTests.csproj
          --configuration Release --no-build --filter "FullyQualifiedName~PolicyDefinitionTests"
          --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish Windows executables
        shell: pwsh
        run: |
          $apps = @{
            'Server'         = 'src/Server/OfficeSecurity.Server.Api'
            'Agent'          = 'src/Agent/OfficeSecurity.Agent'
            'AdminDashboard' = 'src/Clients/OfficeSecurity.AdminDashboard'
            'StaffApp'       = 'src/Clients/OfficeSecurity.StaffApp'
          }
          foreach ($name in $apps.Keys) {
            dotnet publish $apps[$name] --configuration Release --runtime win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              --output "publish/OfficeSecurity-win-x64/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item docs/deployment/READ-ME-FIRST.txt publish/OfficeSecurity-win-x64/

      - name: Screen self-test (admin dashboard and staff app)
        shell: pwsh
        run: |
          $root = "publish/OfficeSecurity-win-x64"
          $failed = $false
          foreach ($app in @("AdminDashboard", "StaffApp")) {
            $log = Join-Path $env:RUNNER_TEMP "$app-smoke.log"
            $p = Start-Process -FilePath "$root/$app/OfficeSecurity.$app.exe" -ArgumentList "--smoke-test", "`"$log`"" -PassThru -Wait
            Write-Host "---- $app (exit code $($p.ExitCode))"
            if (Test-Path $log) { Get-Content $log } else { Write-Host "No log written." }
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Server start-up test on Windows (HTTPS, data protection, first-time setup)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "ocss-server-data"
          $env:Server__DataDirectory = $data
          $out = Join-Path $env:RUNNER_TEMP "server.out.log"
          $err = Join-Path $env:RUNNER_TEMP "server.err.log"
          $p = Start-Process -FilePath "publish/OfficeSecurity-win-x64/Server/OfficeSecurity.Server.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $health = $null
          for ($i = 0; $i -lt 60 -and -not $health; $i++) {
            try { $health = Invoke-RestMethod -Uri "https://localhost:5443/api/v1/health" -SkipCertificateCheck } catch { Start-Sleep -Seconds 1 }
          }
          try {
            if (-not $health) { throw "Server did not answer on https://localhost:5443" }
            Write-Host "Health: $($health.status) $($health.serverVersion)"
            $setup = Invoke-RestMethod -Uri "https://localhost:5443/api/v1/setup/status" -SkipCertificateCheck
            if (-not $setup.firstAdminSetupRequired) { throw "Expected first-time setup to be required" }
            foreach ($f in @("FIRST-ADMIN-SETUP-CODE.txt", "SERVER-CONNECTION-INFO.txt", "office-security.db")) {
              if (-not (Test-Path (Join-Path $data $f))) { throw "Missing $f in data directory" }
            }
            try { Invoke-WebRequest -Uri "https://localhost:5443/api/v1/staff" -SkipCertificateCheck | Out-Null; throw "Staff list was reachable without signing in" }
            catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } }
            Write-Host "Server start-up test passed."
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "---- server output"; Get-Content $out -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
          }

      - name: Agent inventory on Windows (WMI)
        shell: pwsh
        run: |
          & "publish/OfficeSecurity-win-x64/Agent/OfficeSecurity.Agent.exe" inventory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the test MSI used by the end-to-end test (WiX Toolset 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix build tests/windows/ocss-test-package.wxs -arch x64 -bindpath tests/windows -o "$env:RUNNER_TEMP\ocss-test.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Agent Windows Service end-to-end test (install, approve, policy, kill and recover, security controls, install software, uninstall)
        shell: pwsh
        env:
          OCSS_AGENT_EXE: ${{ github.workspace }}\publish\OfficeSecurity-win-x64\Agent\OfficeSecurity.Agent.exe
          OCSS_TEST_MSI: ${{ runner.temp }}\ocss-test.msi
        run: >
          dotnet test tests/OfficeSecurity.Server.IntegrationTests/OfficeSecurity.Server.IntegrationTests.csproj
          --configuration Release --no-build --filter "Category=WindowsService"
          --logger "console;verbosity=detailed" --logger "trx;LogFileName=windows-service.trx" --results-directory TestResults

      - name: Upload Windows service test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-test-results
          path: TestResults/windows-service.trx

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: OfficeSecurity-win-x64
          path: publish/OfficeSecurity-win-x64
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for committed secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose
